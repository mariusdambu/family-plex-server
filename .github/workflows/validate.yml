name: Validate reference source
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_publication.py
      - run: python -m compileall -q configure.py ops.py dashboard.py maintenance.py
