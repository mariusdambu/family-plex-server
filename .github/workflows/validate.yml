name: Validate reference source
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_publication.py
      - run: python -m compileall -q .
      - name: Validate both Compose profiles without starting services
        run: |
          PYTHONPATH=tests python - <<'PY'
          import json, subprocess
          from test_config import sample
          from configure import validate, compose
          for hotplug in (False, True):
              c = sample()
              if hotplug:
                  c.update(usb_hotplug=True, usb_filesystem='exfat', usb_uuid='ABCD-1234',
                           usb_parent='/srv/family-plex-usb', usb_root='/srv/family-plex-usb/disk',
                           adguard_enabled=False)
              subprocess.run(['docker', 'compose', '-f', '-', 'config', '--quiet'],
                             input=json.dumps(compose(validate(c))), text=True, check=True)
          PY
